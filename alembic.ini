[alembic]
script_location = eddn_helper/migrations
prepend_sys_path = .
# Leave sqlalchemy.url empty: env.py resolves it from ELITE_HELPER_DATABASE_URL or the default data dir.
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
