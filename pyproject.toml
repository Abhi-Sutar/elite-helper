[project]
name = "elite-helper"
version = "0.1.0"
description = "EDDN-backed market and faction data for Elite Dangerous (listener, CLI, MCP server)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyzmq>=25",
    "mcp>=2",
    "psycopg[binary]>=3.1",
]

[project.scripts]
elite-dash = "eddn_helper.recce.cli:main"

[tool.uv]
package = false
